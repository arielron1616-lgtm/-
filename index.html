@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141a;--surface:#201f27;--ink:#f1eff5;--muted:#a09cab;--line:#33313c;--accent:#7b9bff;--accent-ink:#10131f;--danger:#ff7b6b}}
:root[data-theme="dark"]{--bg:#15141a;--surface:#201f27;--ink:#f1eff5;--muted:#a09cab;--line:#33313c;--accent:#7b9bff;--accent-ink:#10131f;--danger:#ff7b6b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:2.2rem;margin:0;font-weight:800}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn:focus-visible,.card:focus-visible,.x:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
input[type=file]{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;padding:0;overflow:hidden;border-radius:16px;border:2px solid var(--c);background:var(--surface);color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.tile img{display:block;width:100%;aspect-ratio:16/9;background:#000;object-fit:cover}
.tile .t{padding:12px 16px}
.tile strong{display:block;font-size:1.3rem}
.tile .t span{color:var(--muted)}
.tile:hover{filter:brightness(1.08)}
.player{background:#000;border-radius:14px;overflow:hidden;margin-bottom:8px}
.player video{display:block;width:100%;max-height:70vh;background:#000}
.now{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 22px;color:var(--muted)}
.now b{color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:36px 16px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thumb{aspect-ratio:16/9;background:#111 center/cover;display:block;width:100%}
.meta{padding:10px 12px}
.meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{color:var(--muted);font-size:.85rem}
.x{position:absolute;top:8px;inset-inline-start:8px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer}
.x:hover{background:var(--danger)}
.cast{position:absolute;top:8px;inset-inline-end:8px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:8px;padding:5px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.cast:hover{background:var(--accent);color:var(--accent-ink)}
#msg{color:var(--danger);min-height:1.3em;margin:0 0 10px}
.brand{justify-content:flex-start;flex-wrap:wrap;margin-bottom:20px}
.brand h1{font-size:4.3rem;line-height:1.1}
.logo{display:block;width:110px;height:auto;order:-1}
.sr{position:absolute;left:-9999px}
.line{display:flex;gap:8px;margin:0 0 10px}
.line input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.line div{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.1rem}
.line .del{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;width:44px;cursor:pointer;font-size:16px}
#soonmsg{color:var(--muted)}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#gate img{width:130px;height:auto}
#gate h2{margin:0;font-size:1.8rem}
#gate input{font:inherit;font-size:1.4rem;text-align:center;letter-spacing:.3em;width:min(260px,80vw);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#gerr{color:var(--danger);min-height:1.4em;margin:0}
.bar{display:flex;align-items:center;gap:10px}
</style>

var $=function(i){return document.getElementById(i)};
var msg=$('msg');
function say(t){msg.textContent=t||''}
function mine(){return all.filter(function(x){return(x.cat||'movies')===cat})}

function open(){return new Promise(function(res,rej){
try{var r=indexedDB.open('videos-app',1);
r.onupgradeneeded=function(){r.result.createObjectStore('v',{keyPath:'id'})};
r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};}catch(e){rej(e)}})}
function tx(mode,fn){return new Promise(function(res,rej){
var t=db.transaction('v',mode),s=t.objectStore('v'),q=fn(s);
t.oncomplete=function(){res(q&&q.result)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})}

function size(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB'}
function dur(s){if(!isFinite(s)||!s)return'';var m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+(x<10?'0':'')+x}

function thumb(blob){return new Promise(function(res){
var u=URL.createObjectURL(blob),v=document.createElement('video'),d0=false;
v.muted=true;v.preload='metadata';v.playsInline=true;
var done=function(d,t){if(d0)return;d0=true;URL.revokeObjectURL(u);res({thumb:d,duration:t})};
v.onloadedmetadata=function(){v.currentTime=Math.min(1,(v.duration||1)/4)};
v.onseeked=function(){try{var c=document.createElement('canvas');c.width=320;c.height=Math.round(320*(v.videoHeight||9)/(v.videoWidth||16));
c.getContext('2d').drawImage(v,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',.7),v.duration)}catch(e){done('',v.duration)}};
v.onerror=function(){done('',0)};setTimeout(function(){done('',0)},8000);v.src=u})}

async function addFiles(files){
var list=Array.prototype.filter.call(files,function(f){return f.type.indexOf('video')===0||/\.(mp4|mov|m4v|webm|mkv)$/i.test(f.name)});
if(!list.length){say('לא נבחרו קבצי וידאו.');return}
say('מעלה '+list.length+' סרטונים...');
for(var i=0;i<list.length;i++){
var f=list[i],t=await thumb(f);
var it={id:Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,6),cat:cat,name:f.name.replace(/\.[^.]+$/,''),type:f.type||'video/mp4',size:f.size,added:Date.now(),thumb:t.thumb,duration:t.duration,blob:f};
try{await tx('readwrite',function(s){return s.put(it)})}catch(e){say('לא הצלחתי לשמור את "'+f.name+'". ייתכן שאין מספיק מקום באחסון של הדפדפן.');continue}
all.unshift(it)}
render();if(msg.textContent.indexOf('מעלה')===0)say('');
if(!current&&mine().length)play(mine()[0].id)}

function url(it){if(!urls[it.id])urls[it.id]=URL.createObjectURL(it.blob);return urls[it.id]}

function play(id){
var it=all.find(function(x){return x.id===id});if(!it)return;
current=id;var v=$('vid');v.src=url(it);v.play().catch(function(){});
$('title').innerHTML='';var b=document.createElement('b');b.textContent=it.name;$('title').appendChild(b);
$('stage').hidden=false;render();
$('stage').scrollIntoView({behavior:'smooth',block:'start'})}

async function remove(id){
try{await tx('readwrite',function(s){return s.delete(id)})}catch(e){}
if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id]}
all=all.filter(function(x){return x.id!==id});
if(current===id)stop();
render()}

function stop(){current=null;var v=$('vid');v.pause();v.removeAttribute('src');v.load();$('stage').hidden=true}

function render(){
if(!cat){var t=$('tiles');t.innerHTML='';
CATS.forEach(function(c){
var n=all.filter(function(x){return(x.cat||'movies')===c[0]}).length;
var b=document.createElement('button');b.className='tile';b.style.setProperty('--c',c[2]);
var im=document.createElement('img');im.src=IMG[c[0]];im.alt='';
var d=document.createElement('div');d.className='t';
var s=document.createElement('strong');s.textContent=c[1];
var p=document.createElement('span');p.textContent=c[0]==='live'?(all.length?'משדר '+all.length+' סרטונים באקראי':''):(n?n+' סרטונים':'');
d.appendChild(s);d.appendChild(p);b.appendChild(im);b.appendChild(d);b.onclick=function(){location.hash=c[0]};t.appendChild(b)});return}
if(cat==='soon'||cat==='live'){$('empty').hidden=true;$('grid').innerHTML='';return}
var items=mine(),g=$('grid');g.innerHTML='';$('empty').hidden=items.length>0;
items.forEach(function(it){
var c=document.createElement('div');c.className='card'+(it.id===current?' active':'');c.tabIndex=0;c.setAttribute('role','button');
var th=document.createElement('span');th.className='thumb';if(it.thumb)th.style.backgroundImage='url('+it.thumb+')';
var m=document.createElement('div');m.className='meta';
var s=document.createElement('strong');s.textContent=it.name;
var sp=document.createElement('span');sp.textContent=[dur(it.duration),size(it.size)].filter(Boolean).join(' • ');
m.appendChild(s);m.appendChild(sp);
var x=document.createElement('button');x.className='x';x.textContent='✕';x.title='מחיקה';x.setAttribute('aria-label','מחיקת '+it.name);
x.onclick=function(e){e.stopPropagation();if(confirm('למחוק את "'+it.name+'"?'))remove(it.id)};
c.onclick=function(){play(it.id)};
c.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();play(it.id)}};
c.appendChild(th);c.appendChild(m);if(isOwner)c.appendChild(x);var cb=document.createElement('button');cb.className='cast';cb.textContent='שידור';cb.setAttribute('aria-label','שידור למכשיר קרוב: '+it.name);cb.onclick=function(e){e.stopPropagation();cast(it.id)};c.appendChild(cb);g.appendChild(c)})}

function route(){
var h=location.hash.replace('#',''),c=CATS.find(function(x){return x[0]===h});
if(current)stop();say('');
cat=c?c[0]:null;
$('home').hidden=!!cat;$('cat').hidden=!cat;
if(c)$('cname').textContent=c[1];
var soon=cat==='soon';$('add').hidden=soon||cat==='live'||!isOwner;$('soonbox').hidden=!soon;if(soon)initSoon();$('empty').textContent=isOwner?'עדיין אין כאן סרטונים. לחץ על ״העלאת סרטונים״ או גרור קבצים לכאן.':'עדיין אין כאן סרטונים.';if(cat==='live')startLive();
render()}

$('add').onclick=function(){$('file').click()};
$('back').onclick=function(){location.hash='home'};
$('file').onchange=function(e){addFiles(e.target.files);e.target.value=''};
$('next').onclick=function(){if(cat==='live'){playLive();return}var l=mine();if(!l.length)return;var i=l.findIndex(function(x){return x.id===current});play(l[(i+1)%l.length].id)};
$('vid').onended=function(){if(cat==='live'){playLive();return}var l=mine(),i=l.findIndex(function(x){return x.id===current});if(i>-1&&i<l.length-1)play(l[i+1].id)};
var dz=$('empty');
['dragenter','dragover'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();dz.classList.add('over')})});
['dragleave','drop'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();dz.classList.remove('over')})});
document.addEventListener('drop',function(e){if(isOwner&&cat&&e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files)});

// ===== שורות "בקרוב" =====
// כדי שכולם יראו שורות: כתוב אותן כאן בין הסוגריים המרובעים, למשל ["סרט חדש בקרוב","פרק 3 ביום שלישי"], ואז העלה את הקובץ מחדש.
var SOON_LINES=[];
var lines=[],isOwner=false;
function save(){try{localStorage.setItem('soonLines',JSON.stringify(lines))}catch(e){}$('soonmsg').textContent='נשמר במכשיר הזה בלבד'}
function drawLines(){
var box=$('lines');box.innerHTML='';$('addline').hidden=!isOwner;$('copyl').hidden=!isOwner;
if(!lines.length&&!isOwner){$('soonmsg').textContent='עדיין אין כאן תוכן.';return}
lines.forEach(function(t,i){
var r=document.createElement('div');r.className='line';
if(isOwner){var inp=document.createElement('input');inp.type='text';inp.value=t;inp.setAttribute('aria-label','שורה '+(i+1));
inp.oninput=function(){lines[i]=inp.value;save()};
var d=document.createElement('button');d.className='del';d.textContent='✕';d.title='מחיקת שורה';d.setAttribute('aria-label','מחיקת שורה '+(i+1));
d.onclick=function(){lines.splice(i,1);save();drawLines()};
r.appendChild(inp);r.appendChild(d)}
else{var v=document.createElement('div');v.textContent=t;r.appendChild(v)}
box.appendChild(r)})}
function initSoon(){var st=null;if(isOwner){try{st=JSON.parse(localStorage.getItem('soonLines'))}catch(e){}}
lines=Array.isArray(st)?st:SOON_LINES.slice();$('soonmsg').textContent='';drawLines()}
$('copyl').onclick=function(){var t='var SOON_LINES='+JSON.stringify(lines)+';';
var ok=function(){$('soonmsg').textContent='הועתק. הדבק בקובץ במקום השורה var SOON_LINES=...; והעלה מחדש.'};
if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,function(){prompt('העתק:',t)});else prompt('העתק:',t)};
$('addline').onclick=function(){lines.push('');drawLines();var l=$('lines').querySelectorAll('input');if(l.length)l[l.length-1].focus()};
// ===== מסך סיסמה =====
(function(){
var HASH_USER="29ce6dd846db34508a9a37032d9f90ef48fd34c8751a289789821b59f1cbccbb",HASH_ADMIN="f4df76601a7c42451e4dbdda1e40cd56c3d705f2093ff0ba7069a55e4f3e37bd";
$('glogo').src=document.querySelector('.logo').src;
async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
var K='gateState',LOCK=10*60*1000,tm=null;
function st(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}}
function put(o){try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}}
function lockUI(){
clearInterval(tm);var u=st().until||0;
if(u-Date.now()<=0){$('gpw').disabled=false;$('gok').disabled=false;return false}
$('gpw').disabled=true;$('gok').disabled=true;
var tick=function(){var l=Math.ceil((u-Date.now())/1000);
if(l<=0){clearInterval(tm);var o=st();o.until=0;put(o);$('gerr').textContent='';$('gpw').disabled=false;$('gok').disabled=false;$('gpw').focus();return}
var m=Math.floor(l/60),x=l%60;$('gerr').textContent='הכניסה נחסמה בגלל שתי טעויות ברצף. אפשר לנסות שוב בעוד '+m+':'+(x<10?'0':'')+x}
tick();tm=setInterval(tick,1000);return true}
async function check(){
var e=$('gerr');if(lockUI())return;
if(!(window.crypto&&crypto.subtle)){e.textContent='הדפדפן לא תומך בבדיקת הסיסמה. פתח את האתר בכתובת מאובטחת (https).';return}
var h=await sha('olpha:'+$('gpw').value.trim());
if(h===HASH_USER||h===HASH_ADMIN){isOwner=(h===HASH_ADMIN);put({fails:0,until:0});$('gate').remove();$('app').hidden=false;route();return}
var o=st();o.fails=(o.fails||0)+1;$('gpw').value='';
if(o.fails>=2){o.fails=0;o.until=Date.now()+LOCK;put(o);lockUI();return}
put(o);e.textContent='סיסמה שגויה. נשאר עוד ניסיון אחד.';$('gpw').focus()}
$('gok').onclick=check;
$('gpw').onkeydown=function(e){if(e.key==='Enter')check()};
if(!lockUI())$('gpw').focus();
})();

var lastLive=null;
function playLive(){var l=all.filter(function(x){return x.id!==lastLive});if(!l.length)l=all;if(!l.length)return;
var it=l[Math.floor(Math.random()*l.length)];lastLive=it.id;current=it.id;
var v=$('vid');v.src=url(it);v.play().catch(function(){});$('title').textContent='משודר עכשיו: '+it.name;$('stage').hidden=false}
function startLive(){if(!all.length){say('אין עדיין סרטונים לשידור. העלה סרטונים לקטגוריות והם ישודרו כאן ברצף אקראי.');return}playLive()}
$('vid').onerror=function(){if(cat==='live')setTimeout(playLive,500)};

function cast(id){
if(id&&id!==current)play(id);
var v=$('vid');
try{
if(v.remote&&v.remote.prompt){v.remote.prompt().catch(function(e){say(e&&e.name==='NotFoundError'?'לא נמצאו מכשירים קרובים לשידור.':'לא ניתן לשדר את הסרטון הזה למכשיר קרוב.')})}
else if(v.webkitShowPlaybackTargetPicker){v.webkitShowPlaybackTargetPicker()}
else say('הדפדפן הזה לא תומך בשידור למכשירים קרובים. זה אמור לעבוד ב-Chrome באנדרואיד ובמחשב, וב-Safari באייפון.')
}catch(e){say('לא ניתן לשדר את הסרטון הזה.')}}
$('castbtn').onclick=function(){cast()};
window.addEventListener('hashchange',route);

open().then(function(d){db=d;return tx('readonly',function(s){return s.getAll()})}).then(function(r){
all=(r||[]).sort(function(a,b){return b.added-a.added});route()}).catch(function(){
db={transaction:function(){var o={put:function(){return{}},delete:function(){return{}}};var t={objectStore:function(){return o}};setTimeout(function(){t.oncomplete&&t.oncomplete()},0);return t}};
route();say('האחסון בדפדפן לא זמין, לכן הסרטונים יישמרו רק עד סגירת הדף.')});
})();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script>
